# Generate the Xcode project on a Mac:  brew install xcodegen && xcodegen generate
name: TokuplayIOS
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  TokuplayIOS:
    type: application
    platform: iOS
    sources: [TokuplayIOS]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.tokuplay.ios   # change to your own reverse-DNS id
        INFOPLIST_FILE: TokuplayIOS/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
