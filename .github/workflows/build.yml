name: Build iOS (unsigned IPA)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # XcodeGen from Homebrew writes the Xcode 16 project format (objectVersion 77),
      # so pick the newest Xcode 16+ installed on the runner.
      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_1[6-9]*.app | sort -V | tail -n 1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (no code signing)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild archive \
            -project TokuplayIOS.xcodeproj \
            -scheme TokuplayIOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/TokuplayIOS.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee build/xcodebuild.log
        env:
          NSUnbufferedIO: "YES"

      - name: Package IPA
        run: |
          APP=$(find build/TokuplayIOS.xcarchive/Products/Applications -name '*.app' -maxdepth 1 | head -n 1)
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          (cd build/ipa && zip -qry ../TokuplayIOS-unsigned.ipa Payload)
          ls -lh build/TokuplayIOS-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TokuplayIOS-unsigned-ipa
          path: build/TokuplayIOS-unsigned.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: ignore
