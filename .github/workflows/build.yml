name: Build iOS (unsigned IPA)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (no code signing)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild archive \
            -project TokuplayIOS.xcodeproj \
            -scheme TokuplayIOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/TokuplayIOS.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee build/xcodebuild.log
        env:
          NSUnbufferedIO: "YES"

      - name: Package IPA
        run: |
          APP=$(find build/TokuplayIOS.xcarchive/Products/Applications -name '*.app' -maxdepth 1 | head -n 1)
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          (cd build/ipa && zip -qry ../TokuplayIOS-unsigned.ipa Payload)
          ls -lh build/TokuplayIOS-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TokuplayIOS-unsigned-ipa
          path: build/TokuplayIOS-unsigned.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: ignore
